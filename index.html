<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeedReader</title>
<meta name="theme-color" content="#24313F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Carlito: metric-compatible with Calibri, SIL Open Font Licence, so it can be
     shipped with the app. Windows machines have real Calibri and use that; every
     other device falls back to this 30 KB download. Only the regular weight is
     needed — the reading pane renders plain text with no bold or italic. */
  @font-face {
    font-family: 'Carlito';
    src: url('fonts/carlito-400.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  :root {
    --page:#E9EDF1; --ink:#1E2833; --dim:#5A6673; --bar:#24313F; --barInk:#E9EDF1;
    --mark:#F2D98A; --tint:#F7EFD6; --accent:#2F7D86; --btnInk:#fff; --card:#fff; --line:#C9D2DB;
    --readSize:1.35rem; --readFont:Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  }
  /* Theme follows the system unless the reader has chosen one explicitly. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page:#161C23; --ink:#D5DCE3; --dim:#8B97A3; --bar:#0F141A; --barInk:#D5DCE3;
      --mark:#6B5310; --tint:#332C16; --accent:#5FB3BC; --btnInk:#0F141A;
      --card:#1E262F; --line:#2C3742;
    }
  }
  :root[data-theme="dark"] {
    --page:#161C23; --ink:#D5DCE3; --dim:#8B97A3; --bar:#0F141A; --barInk:#D5DCE3;
    --mark:#6B5310; --tint:#332C16; --accent:#5FB3BC; --btnInk:#0F141A;
    --card:#1E262F; --line:#2C3742;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* Long-press in Chrome raises a text-selection toolbar or a context menu.
     Neither is wanted here, and the selection one competes with tap-to-jump. */
  body, #text, header, footer {
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  /* The settings sheet is ordinary UI — leave its inputs alone. */
  #sheet, #sheet * { -webkit-user-select:auto; user-select:auto; }
  html,body { margin:0; height:100%; }
  body {
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  header {
    display:flex; align-items:center; gap:.75rem;
    padding:.7rem .6rem .7rem 1rem; background:var(--bar); color:var(--barInk); flex:none;
  }
  header h1 { margin:0; font-size:1.05rem; font-weight:600; flex:1;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #progress { font-size:.85rem; opacity:.75; font-variant-numeric:tabular-nums;
              text-align:right; line-height:1.25; }
  #progress small { display:block; font-size:.75rem; opacity:.8; }
  #bar { height:3px; background:var(--accent); width:0; transition:width .2s linear; flex:none; }

  button { font:inherit; border:0; border-radius:.5rem; cursor:pointer; color:var(--btnInk);
           background:var(--accent); min-height:2.75rem; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--mark); outline-offset:2px; }
  .ghost { background:transparent; color:var(--barInk); border:1px solid rgba(255,255,255,.25);
           min-width:2.75rem; padding:0 .7rem; }
  #gear { font-size:1.15rem; min-width:3rem; }
  header .ghost { flex:none; }
  #gear { font-size:1.1rem; }

  /* ---------- library ---------- */
  #library { flex:1; overflow-y:auto; padding:1.25rem 1rem 3rem; }
  .wrap { max-width:44rem; margin:0 auto; }
  .addRow { display:flex; gap:.6rem; margin-bottom:1.25rem; }
  #add { flex:1; font-weight:600; }
  .second { background:transparent; color:var(--accent);
            border:1px solid var(--accent); padding:0 1.1rem; }
  .empty { color:var(--dim); line-height:1.6; }
  .empty code { background:var(--card); padding:.1em .35em; border-radius:.25em; }
  .card { display:flex; align-items:stretch; gap:.5rem; background:var(--card);
          border:1px solid var(--line); border-radius:.6rem; margin-bottom:.6rem; overflow:hidden; }
  .card .open { flex:1; background:none; color:inherit; text-align:left; border-radius:0;
                padding:.85rem 1rem; display:flex; flex-direction:column; gap:.35rem; }
  .card .t { font-weight:600; }
  .card .meta { font-size:.82rem; color:var(--dim); }
  .card .track { height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:.2rem; }
  .card .fill { display:block; height:100%; background:var(--accent); }
  .card .ren,
  .card .del { background:none; color:var(--dim); border-radius:0; padding:0 .85rem; font-size:1.05rem; }
  .card .ren { border-left:1px solid var(--line); }

  /* ---------- reader ---------- */
  #reader { flex:1; display:flex; flex-direction:column; min-height:0; }
  #pane { flex:1; overflow-y:auto; padding:2rem 1.25rem 45vh; }
  #text { max-width:34em; margin:0 auto;
          font-family:var(--readFont); font-size:var(--readSize); line-height:1.75; }
  #text p { margin:0 0 1.2em; }
  #text h2 { font-family:system-ui,sans-serif; font-size:1.05rem; letter-spacing:.03em;
             text-transform:uppercase; color:var(--dim); margin:2em 0 .9em; }
  .w { border-radius:.2em; padding:.04em .1em; margin:0 -.1em; cursor:pointer;
       transition:background-color 60ms; }
  .sp { padding:.04em 0; }
  /* Sentence tint sits under the word highlight: a quieter wash that shows the
     unit you're inside, without competing with the word you're on. */
  .w.sent, .sp.sent { background:var(--tint); }
  .w.sent { border-radius:0; }
  .w.sent:first-of-type { border-radius:.2em 0 0 .2em; }
  .w.on { background:var(--mark); }
  footer { display:flex; align-items:center; gap:.6rem; flex:none;
           padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
           background:var(--bar); color:var(--barInk); }
  #play { min-width:6rem; font-weight:600; }
  #play.on { background:var(--mark); color:var(--ink); }
  footer input[type=range] { flex:1; min-width:3rem; min-height:2.25rem; accent-color:var(--accent); }
  #wpmOut { min-width:4.2em; text-align:right; font-variant-numeric:tabular-nums; font-size:.85rem; }

  /* ---------- overlays ---------- */
  #busy { position:fixed; inset:0; display:grid; place-items:center; gap:1rem;
          background:rgba(0,0,0,.55); color:#fff; z-index:9; font-size:1rem; }
  #sheetBg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:10; }
  #sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:11;
    max-height:82dvh; overflow-y:auto;
    padding:1rem 1.15rem calc(1.15rem + env(safe-area-inset-bottom));
    background:var(--card); color:var(--ink);
    border-top:1px solid var(--line); border-radius:1rem 1rem 0 0;
    box-shadow:0 -8px 28px rgba(0,0,0,.25);
  }
  @media (min-width:44rem) {
    #sheet { left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%,-50%);
             width:30rem; border-radius:1rem; max-height:86dvh; border:1px solid var(--line); }
  }
  .sheetHead { display:flex; align-items:center; justify-content:space-between;
               margin-bottom:.35rem; }
  .sheetHead button { background:none; color:var(--dim); min-height:2.25rem; padding:0 .4rem; }
  #sheet h3 { font-size:.78rem; text-transform:uppercase; letter-spacing:.06em;
              color:var(--dim); margin:1.1rem 0 .3rem; }
  #sheet .row { display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
                padding:.6rem 0; border-bottom:1px solid var(--line); font-size:.95rem; }
  #sheet .row small { flex-basis:100%; color:var(--dim); font-size:.8rem; }
  #sheet select { font:inherit; margin-left:auto; padding:.35rem .5rem;
                  background:var(--page); color:var(--ink);
                  border:1px solid var(--line); border-radius:.4rem; min-height:2.25rem; }
  #sheet input[type=checkbox] { width:1.15rem; height:1.15rem; accent-color:var(--accent); }
  #sheet input[type=range] { flex:1; min-width:6rem; accent-color:var(--accent); }
  #sheet output { min-width:3.2rem; text-align:right; font-variant-numeric:tabular-nums; }
  #sheetDone { width:100%; margin-top:1.1rem; font-weight:600; }
  /* Top, not bottom — the reader's controls live along the bottom edge. */
  #toast { position:fixed; left:50%; top:calc(3.6rem + env(safe-area-inset-top));
           transform:translateX(-50%);
           background:var(--bar); color:var(--barInk); padding:.7rem 1rem;
           border-radius:.5rem; z-index:8; max-width:90vw; font-size:.9rem; }
  #crash {
    position:fixed; left:0; right:0; bottom:0; z-index:99;
    background:#8C1D1D; color:#fff; padding:.7rem 1rem;
    font:600 .82rem/1.4 ui-monospace,Consolas,monospace; word-break:break-word;
  }
  #build { color:var(--dim); font-size:.75rem; text-align:center; margin-top:.8rem; }
  #sheet .note { color:var(--dim); font-size:.82rem; line-height:1.5; margin:.3rem 0 0; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion:reduce) { .w,#bar { transition:none; } }
</style>
</head>
<body>

<section id="library">
  <div class="wrap">
    <h1 style="margin:.2rem 0 1rem;font-size:1.5rem;">SpeedReader</h1>
    <div class="addRow">
      <button id="add" type="button">＋  Add a book</button>
      <button id="guide" class="second" type="button">Guide</button>
    </div>
    <div id="shelf"></div>
  </div>
</section>

<section id="reader" hidden>
  <header>
    <button id="home" class="ghost" type="button" aria-label="Back to library">‹</button>
    <h1 id="bookTitle"></h1>
    <span id="progress">0%</span>
  </header>
  <div id="bar"></div>
  <main id="pane"><div id="text"></div></main>
  <footer>
    <button id="back" class="ghost" type="button" aria-label="Previous sentence">◀</button>
    <button id="play" type="button">Start</button>
    <button id="fwd" class="ghost" type="button" aria-label="Next sentence">▶</button>
    <input id="wpm" type="range" min="100" max="900" step="25" aria-label="Reading speed">
    <output id="wpmOut"></output>
    <button id="gear" class="ghost" type="button" aria-label="Reading settings">⚙</button>
  </footer>
</section>

<div id="sheetBg" hidden></div>
<aside id="sheet" hidden aria-label="Reading settings">
  <div class="sheetHead">
    <strong>Reading settings</strong>
    <button id="sheetClose" type="button" aria-label="Close">✕</button>
  </div>

  <h3>Pacing</h3>
  <label class="row">Words at a time
    <select id="optChunk">
      <option value="1">1</option><option value="2">2</option>
      <option value="3">3</option><option value="4">4</option>
    </select>
  </label>
  <label class="row"><input type="checkbox" id="optSmart"> Smart pacing
    <small>Short function words go quicker, long words get longer;
    the average stays at your set speed</small></label>
  <label class="row"><input type="checkbox" id="optSentPause"> Pause at sentence ends</label>

  <h3>Storage</h3>
  <p id="storage" class="note"></p>

  <h3>Display</h3>
  <label class="row"><input type="checkbox" id="optTint"> Sentence tint
    <small>Wash the whole sentence in a quieter colour</small></label>
  <label class="row"><input type="checkbox" id="optScroll"> Centre scroll
    <small>Keep the highlighted word near the middle</small></label>
  <label class="row">Text size
    <input type="range" id="optSize" min="95" max="190" step="5">
    <output id="optSizeOut"></output>
  </label>
  <label class="row">Typeface
    <select id="optFont">
      <option value="serif">Serif</option>
      <option value="sans">Sans-serif</option>
      <option value="calibri">Calibri</option>
      <option value="mono">Monospace</option>
    </select>
  </label>
  <label class="row">Theme
    <select id="optTheme">
      <option value="auto">Match system</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>

  <button id="sheetDone" type="button">Done</button>
  <div id="build"></div>
</aside>

<div id="busy" hidden><span id="busyMsg">Working…</span></div>
<div id="toast" hidden></div>
<input id="file" type="file" accept=".epub,.txt,.text,application/epub+zip,text/plain" hidden>

<div id="crash" hidden></div>
<script>
  window.SR_BUILD = '2026-09-13j';
  (function () {
    var box = document.getElementById('crash');
    function shout(what) {
      box.textContent = 'build ' + window.SR_BUILD + ' — ' + what;
      box.hidden = false;
    }
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') { shout('could not load ' + e.target.src); return; }
      shout((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      shout('Promise: ' + ((e.reason && e.reason.message) || e.reason));
    });
    box.addEventListener('click', function () { box.hidden = true; });
  })();
</script>
<script type="module" src="app.js"></script>
</body>
</html>
